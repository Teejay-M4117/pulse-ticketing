<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking status — Pulse Tickets</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">PULSE<span>TICKETS</span></a><a class="navlink" href="/">Back to events</a></header><main style="min-height:70vh;display:grid;place-items:center;padding:30px"><section style="max-width:560px;background:white;border:1px solid #e6e4dc;border-radius:8px;padding:35px;width:100%"><p class="eyebrow">PAYMENT UPDATE</p><h1 id="heading" style="font:600 38px 'Space Grotesk'">Checking your booking…</h1><p id="message" style="color:#777;line-height:1.8;font-size:14px">Please wait while we retrieve your payment status.</p><p id="details" style="font-size:12px;color:#777"></p><a class="button" href="/">Explore more events ↗</a></section></main><script>
(async()=>{const params=new URLSearchParams(location.search),id=params.get("order");const h=document.getElementById("heading"),m=document.getElementById("message"),d=document.getElementById("details");if(!id){h.textContent="Booking status unavailable";m.textContent="Return to events and check your email if you completed payment.";return}try{const r=await fetch("/api/orders/"+encodeURIComponent(id));const o=await r.json();if(!r.ok)throw new Error(o.error);d.textContent="Order: "+o.id;if(o.status==="paid"){h.textContent="You're on the list!";m.textContent="Payment confirmed. Your QR ticket(s) are being sent to "+o.email+". If the email doesn't arrive soon, check spam or contact the event organizer."}else{h.textContent="Payment not confirmed yet";m.textContent="Your order is currently "+o.status+". Don't pay again immediately. Refresh in a moment, and check your email after confirmation."}}catch(e){h.textContent="Could not retrieve booking";m.textContent="Please return to events or contact the organizer with your order reference."}})();
</script></body></html>
