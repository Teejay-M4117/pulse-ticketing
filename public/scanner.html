<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Door Scanner — Pulse Tickets</title><link rel="stylesheet" href="/styles.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><header class="top"><a class="brand" href="/">PULSE<span>TICKETS</span></a><a class="navlink" href="/">Public site</a></header><main style="max-width:780px;margin:auto;padding:35px 20px 70px"><p class="eyebrow">STAFF TOOL</p><h1 style="font:600 40px 'Space Grotesk'">Ticket scanner</h1><p class="muted">This page has no staff login by design, so the scanner API is protected by a private scanner key. Do not share that key or this page with ticket buyers.</p><label for="scanner-key">Scanner key</label><input id="scanner-key" type="password" placeholder="Enter SCANNER_KEY from .env" autocomplete="off"><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button id="start" class="button">Start camera scanner</button><button id="stop" class="button" style="background:#eee">Stop camera</button></div><div id="reader" style="max-width:500px;margin:20px 0"></div><label for="manual">Or paste ticket QR contents / ticket ID</label><input id="manual" placeholder='Ticket ID or QR JSON {"ticketId":"..."}'><button id="check-manual" class="button" style="margin-top:12px">Validate and check in</button><div id="result" style="margin-top:20px;padding:18px;border-radius:6px;background:#eee;line-height:1.7" role="status">Scanner ready. A ticket can only be checked in once.</div><div id="stats" class="muted" style="margin-top:18px"></div></main><script>
let scanner=null,busy=false;const $=id=>document.getElementById(id);
function result(msg,ok=false){$("result").style.background=ok?"#e6f4d7":"#fde8e7";$("result").textContent=msg}
function key(){return $("scanner-key").value.trim()}
function parseTicket(raw){try{const j=JSON.parse(raw);return j.ticketId||raw}catch{return raw.trim()}}
async function check(raw){if(busy)return;busy=true;try{if(!key())throw new Error("Enter the scanner key first.");const ticketId=parseTicket(raw);const r=await fetch("/api/scanner/checkin",{method:"POST",headers:{"Content-Type":"application/json","x-scanner-key":key()},body:JSON.stringify({ticketId})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Ticket rejected");result(d.message+" Ticket ID: "+d.ticketId,true);loadStats()}catch(e){result("REJECTED — "+e.message)}finally{busy=false}}
$("start").onclick=async()=>{try{if(!key())return result("Enter scanner key first.");if(!window.Html5Qrcode)throw new Error("QR library failed to load. Use manual validation.");scanner=new Html5Qrcode("reader");await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},decoded=>{scanner.pause(true);check(decoded).finally(()=>setTimeout(()=>{try{scanner.resume()}catch{}},1800))},()=>{});result("Camera running. Point it at a ticket QR code.",true)}catch(e){result("Could not start camera: "+e.message)}};
$("stop").onclick=async()=>{if(scanner){try{await scanner.stop();await scanner.clear()}catch{}scanner=null}result("Camera stopped.")};
$("check-manual").onclick=()=>check($("manual").value);
async function loadStats(){if(!key())return;try{const r=await fetch("/api/scanner/stats",{headers:{"x-scanner-key":key()}});const d=await r.json();if(r.ok)$("stats").textContent=`Paid orders: ${d.paidOrders} · Tickets: ${d.tickets} · Checked in: ${d.checkedIn}`}catch{}}
$("scanner-key").addEventListener("change",loadStats);
</script></body></html>
